# Generated by build_statistics.py. HA-only; never actuates the garage door.
automation:
- id: linear_garage_slow_trip_alert
  alias: Linear Garage Gate Slow Trip Alert
  description: Notify the configured phone only when a newly completed full trip exceeds its learned directional
    baseline. No door commands or TTS.
  triggers:
  - trigger: state
    entity_id: sensor.linear_garage_statistics
    attribute: data
  conditions:
  - condition: template
    value_template: |-
      {% set before = trigger.from_state.attributes.get('data', {}) if trigger.from_state else {} %}
      {% set after = trigger.to_state.attributes.get('data', {}) if trigger.to_state else {} %}
      {{ before is mapping and 'slow_seq' in before and after.get('slow_seq', 0) > before.get('slow_seq', 0)
         and 0 <= as_timestamp(now()) - after.get('last_slow', {}).get('at', 0) < 30 }}
  actions:
  - action: notify.mobile_app_your_phone
    data:
      title: Garage Gate Travel Slower Than Usual
      message: |-
        {% set r = trigger.to_state.attributes['data']['last_slow'] %}
        车库大门本次{{ '开启' if r.direction == 'opening' else '关闭' }}耗时 {{ r.seconds | round(1) }} 秒，平时基准约 {{ r.baseline | round(1) }} 秒。请留意是否有异常阻力；此提醒包含状态检测和网络延迟，不能单独判断机械故障。
      data:
        tag: linear-garage-slow-trip
        group: garage-gate
  mode: single
