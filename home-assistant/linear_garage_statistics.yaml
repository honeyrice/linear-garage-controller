# Generated by build_statistics.py. HA-only; never actuates the garage door.
- triggers:
  - trigger: state
    entity_id: sensor.linear_garage_controller_motion
    id: motion
    to: null
  - trigger: state
    entity_id: sensor.linear_garage_controller_gate_state
    id: gate
    to: null
  - trigger: state
    entity_id: binary_sensor.linear_garage_controller_controller_online
    id: online
    to: null
  - trigger: state
    entity_id: binary_sensor.garage_closed_contact
    id: contact
    to: null
  - trigger: time_pattern
    minutes: /1
    id: tick
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: event
    event_type: event_template_reloaded
    id: reload
  sensor:
  - name: Linear Garage Gate Statistics
    unique_id: linear_garage_statistics
    default_entity_id: sensor.linear_garage_statistics
    state: '{{ ''monitoring'' if is_state(''binary_sensor.linear_garage_controller_controller_online'', ''on'')
      else ''monitor_offline'' }}'
    icon: mdi:chart-timeline-variant
    attributes:
      data: |
        {# Embedded into linear_garage_statistics.yaml by build_statistics.py.
           Pure event reducer: never calls a service or actuates a device. #}
        {% set old = this.attributes.get('data', {}) %}
        {% set ts = as_timestamp(now()) %}
        {% set day = now().strftime('%Y-%m-%d') %}
        {% set motion = states('sensor.linear_garage_controller_motion') %}
        {% set gate = states('sensor.linear_garage_controller_gate_state') %}
        {% set online = is_state('binary_sensor.linear_garage_controller_controller_online', 'on') %}
        {% set contact = states('binary_sensor.garage_closed_contact') %}
        {% set reset = trigger.id in ['startup', 'reload'] %}
        {% set d = namespace(v=dict(
          schema=1, started_at=old.get('started_at', ts), date=day,
          up_today=old.get('up_today', 0) if old.get('date') == day else 0,
          down_today=old.get('down_today', 0) if old.get('date') == day else 0,
          up_total=old.get('up_total', 0), down_total=old.get('down_total', 0),
          last_open_s=old.get('last_open_s'), last_close_s=old.get('last_close_s'),
          open_samples=old.get('open_samples', []), close_samples=old.get('close_samples', []),
          slow_seq=old.get('slow_seq', 0), last_slow=old.get('last_slow', {}),
          result_seq=old.get('result_seq', 0), last_result=old.get('last_result', {}),
          open_since=old.get('open_since', 0),
          open_since_estimated=old.get('open_since_estimated', true),
          contact_last=old.get('contact_last', ''),
          prev_motion=old.get('prev_motion', ''), endpoint=old.get('endpoint', ''),
          trip=old.get('trip', {})
        )) %}
        {# A contact outage or HA restart breaks proof of uninterrupted openness.
           Start a new lower-bound observation when it returns open. #}
        {% if contact == 'off' %}
          {% set d.v = dict(d.v, open_since=0, open_since_estimated=false) %}
        {% elif contact == 'on' %}
          {% if d.v.open_since <= 0 or d.v.contact_last != 'on' or trigger.id == 'startup' %}
            {% set d.v = dict(d.v, open_since=ts,
              open_since_estimated=(d.v.contact_last != 'off' or trigger.id == 'startup')) %}
          {% endif %}
        {% else %}
          {% set d.v = dict(d.v, open_since=0, open_since_estimated=true) %}
        {% endif %}
        {% set d.v = dict(d.v, contact_last=contact) %}
        {# Drop incomplete trips on restart/reload, disconnect, or loss of position.
           Counts and completed observations survive these interruptions. #}
        {% if reset or not online or motion not in ['opening', 'closing', 'stopped']
              or gate in ['unavailable', 'unknown'] %}
          {% set d.v = dict(d.v, trip={}, prev_motion='', endpoint='') %}
          {% if reset and online and motion == 'stopped' and gate in ['closed', 'open_estimated'] %}
            {# A known stationary endpoint can be armed immediately after reload.
               Do not miss a real start before the next minute tick. #}
            {% set d.v = dict(d.v, prev_motion='stopped', endpoint=gate) %}
          {% endif %}
        {% else %}
          {% if motion in ['opening', 'closing'] and motion != d.v.prev_motion %}
            {% if d.v.prev_motion in ['opening', 'closing', 'stopped'] %}
              {% if motion == 'opening' %}
                {% set d.v = dict(d.v, up_today=d.v.up_today + 1, up_total=d.v.up_total + 1) %}
              {% else %}
                {% set d.v = dict(d.v, down_today=d.v.down_today + 1, down_total=d.v.down_total + 1) %}
              {% endif %}
              {% set eligible = (motion == 'opening' and d.v.endpoint == 'closed')
                or (motion == 'closing' and d.v.endpoint == 'open_estimated') %}
              {% set d.v = dict(d.v, trip=dict(direction=motion, start=ts, stop=0, eligible=eligible)) %}
            {% else %}
              {# Already moving at first observation: no inferred start/count. #}
              {% set d.v = dict(d.v, trip={}) %}
            {% endif %}
            {% set d.v = dict(d.v, endpoint='') %}
          {% endif %}
          {% if motion == 'stopped' and d.v.trip %}
            {% if d.v.trip.stop == 0 %}
              {% set d.v = dict(d.v, trip=dict(d.v.trip, stop=ts)) %}
            {% endif %}
            {% set trip = d.v.trip %}
            {% set target = 'open_estimated' if trip.direction == 'opening' else 'closed' %}
            {% if trip.eligible and gate == target and ts - trip.stop <= 5 %}
              {# Use first stopped report, not delayed closed-reference calibration. #}
              {% set seconds = (trip.stop - trip.start) | round(2) %}
              {% if 2 <= seconds <= 120 %}
                {% set samples = d.v.open_samples if trip.direction == 'opening' else d.v.close_samples %}
                {% set sorted_samples = samples | sort %}
                {% set n = samples | length %}
                {% set baseline = ((sorted_samples[(n - 1) // 2] + sorted_samples[n // 2]) / 2) if n else 0 %}
                {% set slow = n >= 5 and seconds > [baseline * 1.3, baseline + 2] | max %}
                {% set result = dict(direction=trip.direction, seconds=seconds, baseline=baseline,
                  baseline_samples=n, slow=slow, at=ts) %}
                {% set d.v = dict(d.v, result_seq=d.v.result_seq + 1, last_result=result) %}
                {% if slow %}
                  {% set d.v = dict(d.v, slow_seq=d.v.slow_seq + 1, last_slow=result) %}
                {% endif %}
                {# Keep the last ten accepted samples per direction; don't train on anomalies. #}
                {% set next_samples = samples if slow else (samples + [seconds])[-10:] %}
                {% if trip.direction == 'opening' %}
                  {% set d.v = dict(d.v, last_open_s=seconds, open_samples=next_samples) %}
                {% else %}
                  {% set d.v = dict(d.v, last_close_s=seconds, close_samples=next_samples) %}
                {% endif %}
              {% endif %}
              {% set d.v = dict(d.v, trip={}) %}
            {% elif ts - trip.stop > 5 %}
              {% set d.v = dict(d.v, trip={}) %}
            {% endif %}
          {% endif %}
          {% if d.v.trip and ts - d.v.trip.start > 120 %}
            {% set d.v = dict(d.v, trip={}) %}
          {% endif %}
          {% if motion == 'stopped' and gate in ['closed', 'open_estimated'] %}
            {% set d.v = dict(d.v, endpoint=gate) %}
          {% elif motion == 'stopped' and gate == 'stopped' %}
            {% set d.v = dict(d.v, endpoint='') %}
          {% endif %}
          {% set d.v = dict(d.v, prev_motion=motion) %}
        {% endif %}
        {{ d.v }}
- sensor:
  - name: Linear Garage Gate Opening Starts Today
    unique_id: linear_garage_opening_starts_today
    default_entity_id: sensor.linear_garage_opening_starts_today
    state: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''up_today'', 0) if (state_attr(''sensor.linear_garage_statistics'',
      ''data'') or {}).get(''date'') == now().strftime(''%Y-%m-%d'') else 0 }}'
    availability: '{{ state_attr(''sensor.linear_garage_statistics'', ''data'') is mapping }}'
    state_class: total_increasing
    unit_of_measurement: starts
    icon: mdi:counter
    attributes:
      meaning: Observed movement starts, including manual controls and mid-travel resumes; offline movements are
        not inferred.
      statistics_since: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''started_at'')
        | timestamp_local }}'
  - name: Linear Garage Gate Opening Starts Total
    unique_id: linear_garage_opening_starts_total
    default_entity_id: sensor.linear_garage_opening_starts_total
    state: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''up_total'', 0) }}'
    availability: '{{ state_attr(''sensor.linear_garage_statistics'', ''data'') is mapping }}'
    state_class: total_increasing
    unit_of_measurement: starts
    icon: mdi:counter
    attributes:
      meaning: Observed movement starts, including manual controls and mid-travel resumes; offline movements are
        not inferred.
      statistics_since: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''started_at'')
        | timestamp_local }}'
  - name: Linear Garage Gate Closing Starts Today
    unique_id: linear_garage_closing_starts_today
    default_entity_id: sensor.linear_garage_closing_starts_today
    state: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''down_today'', 0) if (state_attr(''sensor.linear_garage_statistics'',
      ''data'') or {}).get(''date'') == now().strftime(''%Y-%m-%d'') else 0 }}'
    availability: '{{ state_attr(''sensor.linear_garage_statistics'', ''data'') is mapping }}'
    state_class: total_increasing
    unit_of_measurement: starts
    icon: mdi:counter
    attributes:
      meaning: Observed movement starts, including manual controls and mid-travel resumes; offline movements are
        not inferred.
      statistics_since: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''started_at'')
        | timestamp_local }}'
  - name: Linear Garage Gate Closing Starts Total
    unique_id: linear_garage_closing_starts_total
    default_entity_id: sensor.linear_garage_closing_starts_total
    state: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''down_total'', 0) }}'
    availability: '{{ state_attr(''sensor.linear_garage_statistics'', ''data'') is mapping }}'
    state_class: total_increasing
    unit_of_measurement: starts
    icon: mdi:counter
    attributes:
      meaning: Observed movement starts, including manual controls and mid-travel resumes; offline movements are
        not inferred.
      statistics_since: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''started_at'')
        | timestamp_local }}'
  - name: Linear Garage Gate Last Open Duration
    unique_id: linear_garage_last_open_duration
    default_entity_id: sensor.linear_garage_last_open_duration
    state: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''last_open_s'') }}'
    availability: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''last_open_s'') is
      number }}'
    device_class: duration
    unit_of_measurement: s
    icon: mdi:timer-outline
    attributes:
      meaning: Last uninterrupted full trip observed by HA; includes motion-stop detection and network reporting
        delay.
  - name: Linear Garage Gate Open Duration Baseline
    unique_id: linear_garage_open_duration_baseline
    default_entity_id: sensor.linear_garage_open_duration_baseline
    state: |-
      {% set v = (state_attr('sensor.linear_garage_statistics', 'data') or {}).get('open_samples', []) | sort %}
      {% set n = v | length %}
      {{ ((v[(n-1)//2] + v[n//2])/2) | round(2) if n else none }}
    availability: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''open_samples'', [])
      | length > 0 }}'
    device_class: duration
    unit_of_measurement: s
    icon: mdi:timer-check-outline
    attributes:
      sample_count: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''open_samples'',
        []) | length }}'
      alert_ready: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''open_samples'', [])
        | length >= 5 }}'
      meaning: Median of up to ten accepted full trips in this direction; slow outliers excluded after learning.
  - name: Linear Garage Gate Last Close Duration
    unique_id: linear_garage_last_close_duration
    default_entity_id: sensor.linear_garage_last_close_duration
    state: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''last_close_s'') }}'
    availability: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''last_close_s'') is
      number }}'
    device_class: duration
    unit_of_measurement: s
    icon: mdi:timer-outline
    attributes:
      meaning: Last uninterrupted full trip observed by HA; includes motion-stop detection and network reporting
        delay.
  - name: Linear Garage Gate Close Duration Baseline
    unique_id: linear_garage_close_duration_baseline
    default_entity_id: sensor.linear_garage_close_duration_baseline
    state: |-
      {% set v = (state_attr('sensor.linear_garage_statistics', 'data') or {}).get('close_samples', []) | sort %}
      {% set n = v | length %}
      {{ ((v[(n-1)//2] + v[n//2])/2) | round(2) if n else none }}
    availability: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''close_samples'', [])
      | length > 0 }}'
    device_class: duration
    unit_of_measurement: s
    icon: mdi:timer-check-outline
    attributes:
      sample_count: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''close_samples'',
        []) | length }}'
      alert_ready: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''close_samples'',
        []) | length >= 5 }}'
      meaning: Median of up to ten accepted full trips in this direction; slow outliers excluded after learning.
  - name: Linear Garage Gate Open Duration
    unique_id: linear_garage_gate_open_duration
    default_entity_id: sensor.linear_garage_gate_open_duration
    state: |-
      {% set d = (state_attr('sensor.linear_garage_statistics', 'data') or {}) %}
      {{ ((as_timestamp(now()) - d.get('open_since', as_timestamp(now()))) / 60) | round(1) if is_state('binary_sensor.garage_closed_contact', 'on') and d.get('open_since', 0) > 0 else 0 }}
    availability: '{{ states(''binary_sensor.garage_closed_contact'') in [''on'', ''off''] and state_attr(''sensor.linear_garage_statistics'',
      ''data'') is mapping }}'
    device_class: duration
    unit_of_measurement: min
    icon: mdi:garage-open
    attributes:
      estimated_lower_bound: '{{ (state_attr(''sensor.linear_garage_statistics'', ''data'') or {}).get(''open_since_estimated'',
        true) }}'
      source: binary_sensor.garage_closed_contact
      meaning: Time since leaving the closed contact, including partial opening; after unknown/startup only observed
        time is counted.
